name: Cargar turnos de trabajo

on:
  workflow_dispatch:
    inputs:
      turnos:
        description: 'Eventos separados por ";", cada uno "FECHA|NOTA". Ej: 2026-09-01|Oficina;2026-09-02|Casa'
        required: true
        type: string

jobs:
  cargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - run: python scripts/crear_turnos.py
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          TURNOS: ${{ inputs.turnos }}
