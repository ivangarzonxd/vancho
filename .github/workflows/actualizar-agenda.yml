name: Actualizar agenda

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests icalendar

      - run: python scripts/actualizar_datos.py
        env:
          GOOGLE_CALENDAR_ICS_URL: ${{ secrets.GOOGLE_CALENDAR_ICS_URL }}

      # Si esto falla (la API no oficial de ESPN cambia de forma, se cae, etc.)
      # no debe tumbar todo el job: la agenda igual debe quedar comiteada.
      # No necesita ninguna cuenta ni secreto: es una API publica sin clave.
      - run: python scripts/actualizar_partidos.py
        continue-on-error: true

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/datos-agenda.js js/datos-partidos.js
          git diff --quiet --cached || git commit -m "Actualizar agenda y partidos automaticamente"
          git push
