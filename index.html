<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pagina de inicio</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/clima.css">
    <link rel="stylesheet" href="css/agenda.css">
    <link rel="stylesheet" href="css/partidos.css">
    <link rel="stylesheet" href="css/dolar.css">
    <link rel="stylesheet" href="css/tareas.css">
</head>
<body>
<!--pagina de inicio personalizada
titulo de bienvenida con hora local de españa y colombia
cajon con agenda personal mensual
cajon con lista de tareas pendientes
cajon con informacion de equipos de futbol de interes
cajon con cambio de divisa 
cajon con noticias de interes
cajon con pronostico del clima
esta pagina estara alojada en github pages y en github actions un robot enviara un json con python para actualizar diariamente esta pagina en mi pagina de inicio de mi navegador
-->

<header>
    <h1>Mi Panel</h1>
</header>

  <main class="panel">

    <!-- El orden de estas secciones es el orden visual (izquierda a derecha, arriba a abajo,
         se cierra una fila cada 4 unidades de "span"). Para reordenar un cajon, mueve su
         <section> a otra posicion en esta lista. Para cambiar su tamaño horizontal, edita
         "grid-column: span N" en el archivo css de ESE cajon (no aqui). -->
    <section class="cajon" id="agenda"></section>
    <section class="cajon" id="tareas"></section>
    <section class="cajon" id="dolar"></section>
    <section class="cajon" id="clima"></section>
    <section class="cajon" id="partidos"></section>

  </main>
<script src="js/auto-refresh.js"></script>
<script src="js/clima.js"></script>
<script src="js/datos-festivos.js"></script>
<script src="js/datos-agenda.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="js/tareas.js"></script>
<script src="js/agenda.js"></script>
<script src="js/partidos.js"></script>
<script src="js/dolar.js"></script>
</body>
</html>
