<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pagina de inicio</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/clima.css">
    <link rel="stylesheet" href="css/agenda.css">
    <link rel="stylesheet" href="css/pendientes.css">
</head>
<body>
<!--pagina de inicio personalizada
cajon con agenda personal (incluye los turnos de trabajo y los proximos partidos de futbol)
cajon de pendientes (lista personal + cambio de divisa y hora de Colombia abajo)
cajon con pronostico del clima
esta pagina estara alojada en github pages y en github actions un robot enviara un json con python para actualizar diariamente esta pagina en mi pagina de inicio de mi navegador
-->

<header>
    <h1>Mi Panel</h1>
</header>

  <main class="panel">

    <!-- La posicion visual de cada cajon (columna angosta/ancha, fila de arriba/abajo) la
         define "grid-column"/"grid-row" en el archivo css de ESE cajon (no aqui). El orden de
         estas <section> solo importa en movil, donde se apilan tal cual aparecen aqui. -->
    <section class="cajon" id="pendientes"></section>
    <section class="cajon" id="agenda"></section>
    <section class="cajon" id="clima"></section>

  </main>
<script src="js/auto-refresh.js"></script>
<script src="js/clima.js"></script>
<script src="js/datos-festivos.js"></script>
<script src="js/datos-agenda.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="js/pendientes.js"></script>
<script src="js/agenda.js"></script>
</body>
</html>
